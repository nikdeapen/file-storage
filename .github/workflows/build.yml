on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no features
            features: ""
          - name: r2
            features: "--features r2"
          - name: all features
            features: "--all-features"
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --no-default-features ${{ matrix.features }} --verbose
      - name: Test
        run: cargo test --no-default-features ${{ matrix.features }} --verbose
      - name: Lint
        run: cargo clippy --no-default-features ${{ matrix.features }} --all-targets -- -D warnings
