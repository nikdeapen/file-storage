[package]
name = "file-storage"
version = "0.10.0"
description = "This library aids in accessing file-like storage."
readme = "README.md"
repository = "https://github.com/nikdeapen/file-storage"
homepage = "https://github.com/nikdeapen/file-storage"
authors = ["Nik Deapen <nik@deapen.com>"]
edition = "2021"
rust-version = "1.80"
license = "MIT"

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
module_inception = "allow"

[dependencies]
uuid = { version = "1.29.1", features = ["v4"] }

# R2
aws-config = { version = "1.5.9", optional = true }
aws-sdk-s3 = { version = "1.85.0", optional = true }
dashmap = { version = "6.1.0", optional = true }
tokio = { version = "1.45.0", optional = true }
bytes = { version = "1.11.0", optional = true }
aws-smithy-async = { version = "1.2.6", optional = true }

[dev-dependencies]
chrono = "0.4.43"

[features]
r2 = [
    "dep:aws-config",
    "dep:aws-sdk-s3",
    "dep:aws-smithy-async",
    "dep:bytes",
    "dep:dashmap",
    "dep:tokio",
    "tokio/rt-multi-thread",
]
